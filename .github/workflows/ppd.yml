name: PPD research discovery and publishing
on:
  schedule:
    - cron: '15 5,17 * * *'
  workflow_dispatch:
    inputs:
      action:
        description: 'discover, publish, test or learning'
        required: true
        type: choice
        options: [discover, publish, test, learning, batch]
        default: discover
permissions:
  contents: write
concurrency:
  group: ppd-publisher
  cancel-in-progress: false
jobs:
  ppd:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Discover candidate references
        if: inputs.action == 'discover'
        run: python pipeline.py discover
      - name: Publish approved entries
        if: inputs.action == 'publish'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL_ID: ${{ vars.TELEGRAM_CHANNEL_ID }}
        run: python pipeline.py publish
      - name: Send connection test
        if: inputs.action == 'test'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL_ID: ${{ vars.TELEGRAM_CHANNEL_ID }}
        run: python pipeline.py test
      - name: Publish next learning lesson
        if: github.event_name == 'schedule' || inputs.action == 'learning'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL_ID: ${{ vars.TELEGRAM_CHANNEL_ID }}
        run: python learning.py
      - name: Publish all remaining introductory lessons
        if: inputs.action == 'batch'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL_ID: ${{ vars.TELEGRAM_CHANNEL_ID }}
        run: python learning.py batch
      - name: Persist queue and delivery log
        if: github.event_name == 'schedule' || inputs.action == 'discover' || inputs.action == 'publish' || inputs.action == 'learning' || inputs.action == 'batch'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/sources.json data/sent.json data/learning_state.json
          if ! git diff --cached --quiet; then
            git commit -m 'Update PPD discovery and publication state'
            git push
          fi
